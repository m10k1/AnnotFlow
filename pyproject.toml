[project]
name = "annotflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "iterative-stratification>=0.1.7",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyside6>=6.5.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.35.0",
    "umap-learn>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
